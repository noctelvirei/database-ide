# PROTOTYPE: throwaway spike for the UI toolkit decision. Not product code.
[package]
name = "gpui-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Pre-1.0 gpui: pinned exactly, as decided in issue #8.
gpui-component = { version = "=0.10.0", features = ["tree-sitter-sql"] }
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
lsp-types = "0.97"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
