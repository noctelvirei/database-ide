<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>loaded-tauri</title>
    <style>
      html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; }
      #editor { height: 250px; border-bottom: 1px solid #ccc; overflow: auto; }
      #editor .cm-editor { height: 100%; }
      #grid { flex: 1; overflow: auto; position: relative; }
      #spacer { position: relative; }
      #rows { position: absolute; left: 0; right: 0; }
      .r { display: flex; height: 22px; line-height: 22px; }
      .r span { width: 140px; flex: none; padding: 0 4px; border-right: 1px solid #eee; overflow: hidden; white-space: nowrap; }
    </style>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div id="editor"></div>
    <div id="grid"><div id="spacer"><div id="rows"></div></div></div>
  </body>
</html>
