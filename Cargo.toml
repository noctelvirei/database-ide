[workspace]
members = ["crates/engine", "crates/dbide-cli", "crates/test-servers"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noctelvirei/database-ide"

[workspace.dependencies]
csv = "^1.4.0"
rust_xlsxwriter = { version = "^0.102.0", features = ["constant_memory"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
keyring = { version = "=3.6.3", features = ["windows-native"] }
toml = "=1.2.1"
quick-xml = "0.42.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlparser = { version = "=0.64.0", features = ["visitor"] }
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-postgres = { version = "0.7.18", features = ["gss"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2"
rand = "0.9"
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }

# Our fork: column type OIDs in simple-query results, GSSAPI/SSPI sign-in (ADR 0001).
[patch.crates-io]
tokio-postgres = { git = "https://github.com/noctelvirei/rust-postgres", rev = "a0d7f2416bfebe14a4f7603f00ac410e07a64c2c" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pub_use = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
